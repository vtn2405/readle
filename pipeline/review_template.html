<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt OCR</title>
<style>
  :root {
    --bg: #f5f1e6; --panel: #fffdf6; --ink: #2e2a23; --muted: #6b6250;
    --line: #ddd4bf; --accent: #a67c2e; --danger: #b3402a; --ok: #3e7c43;
    --sel: #fff3d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header {
    position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.small { padding: 2px 8px; font-size: 12px; }
  #layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; height: calc(100vh - 53px); }
  #left { overflow: auto; padding: 16px; }
  #right { overflow: auto; padding: 16px; border-left: 1px solid var(--line); }
  .page-wrap { position: relative; margin-bottom: 16px; }
  .page-wrap img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; }
  .bbox {
    position: absolute; border: 2px solid rgba(166,124,46,.65); border-radius: 3px; cursor: pointer;
    display: flex; align-items: flex-start; justify-content: flex-start;
  }
  .bbox .tag {
    font-size: 11px; font-weight: 700; color: #fff; background: rgba(166,124,46,.85);
    padding: 0 5px; border-radius: 0 0 4px 0; pointer-events: none;
  }
  .bbox.ignore { border-color: rgba(107,98,80,.35); } .bbox.ignore .tag { background: rgba(107,98,80,.5); }
  .bbox.selected { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(179,64,42,.25); }
  .bbox.selected .tag { background: var(--danger); }
  .block {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .block.selected { background: var(--sel); border-color: var(--accent); }
  .block.ignore { opacity: .55; }
  .block.dragover { border-top: 3px solid var(--accent); }
  .block-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .order-no { font-weight: 700; color: var(--accent); min-width: 26px; }
  .handle { cursor: grab; color: var(--muted); user-select: none; }
  select { font: inherit; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .conf { font-size: 12px; padding: 1px 7px; border-radius: 99px; background: #e7efe7; color: var(--ok); }
  .conf.low { background: #f6e3de; color: var(--danger); font-weight: 700; }
  .spacer { flex: 1; }
  textarea {
    width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; resize: vertical; min-height: 40px; background: #fff; color: var(--ink);
  }
  .icon-row { margin-top: 6px; display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .icon-row input { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  details.lines { margin-top: 6px; font-size: 12px; color: var(--muted); }
  details.lines td { padding: 1px 8px 1px 0; }
  details.lines .low { color: var(--danger); font-weight: 600; }
  #hint { font-size: 12px; color: var(--muted); }
  #draft-note { font-size: 12px; color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1 id="title">Duyệt OCR</h1>
  <span id="draft-note"></span>
  <span id="hint">Kéo thẻ để đổi thứ tự · “⇧ nối” gộp vào block trên · sửa chữ trực tiếp</span>
  <button id="reset">Bỏ nháp, về OCR gốc</button>
  <button id="export" class="primary">Xuất normalized_sections.json</button>
</header>
<div id="layout">
  <div id="left"></div>
  <div id="right"></div>
</div>
<script>
const OCR = __OCR_JSON__;
const IMAGES = __IMAGES_JSON__;
const LS_KEY = "readle_review_" + OCR.slug;
const ROLES = [
  ["article_title", "Tiêu đề bài"],
  ["section_title", "Tiêu đề section"],
  ["body", "Thân bài"],
  ["ignore", "Bỏ"],
];

let blocks;            // state: mảng theo thứ tự hiển thị
let selectedId = null;

function freshState() {
  return OCR.blocks.map(b => ({
    id: b.block_id, page: b.page, box: b.box, label: b.label,
    role: b.role, text: b.text, icon: "", lines: b.lines,
    minConf: b.lines.length ? Math.min(...b.lines.map(l => l.confidence)) : 1,
  }));
}
function saveDraft() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(blocks.map(({lines, ...rest}) => rest)));
    document.getElementById("draft-note").textContent = "đã lưu nháp trong trình duyệt";
  } catch (e) {}
}
function loadDraft() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    const byId = Object.fromEntries(OCR.blocks.map(b => [b.block_id, b]));
    return saved.filter(s => byId[s.id]).map(s => ({
      ...s,
      lines: byId[s.id].lines,
      minConf: byId[s.id].lines.length ? Math.min(...byId[s.id].lines.map(l => l.confidence)) : 1,
    }));
  } catch (e) { return null; }
}

// ---------------- render ảnh + box ----------------
function renderLeft() {
  const left = document.getElementById("left");
  left.innerHTML = "";
  OCR.pages.forEach((page, pno) => {
    const wrap = document.createElement("div");
    wrap.className = "page-wrap";
    const img = document.createElement("img");
    img.src = IMAGES[pno];
    wrap.appendChild(img);
    blocks.forEach((b, idx) => {
      if (b.page !== pno) return;
      const d = document.createElement("div");
      d.className = "bbox" + (b.role === "ignore" ? " ignore" : "") + (b.id === selectedId ? " selected" : "");
      d.dataset.id = b.id;
      const [x0, y0, x1, y1] = b.box;
      d.style.left = (x0 / page.width * 100) + "%";
      d.style.top = (y0 / page.height * 100) + "%";
      d.style.width = ((x1 - x0) / page.width * 100) + "%";
      d.style.height = ((y1 - y0) / page.height * 100) + "%";
      d.innerHTML = `<span class="tag">${idx + 1}</span>`;
      d.onclick = () => select(b.id, "right");
      wrap.appendChild(d);
    });
    left.appendChild(wrap);
  });
}

// ---------------- render danh sách block ----------------
function renderRight() {
  const right = document.getElementById("right");
  right.innerHTML = "";
  blocks.forEach((b, idx) => {
    const card = document.createElement("div");
    card.className = "block" + (b.role === "ignore" ? " ignore" : "") + (b.id === selectedId ? " selected" : "");
    card.dataset.id = b.id;
    card.draggable = true;

    const head = document.createElement("div");
    head.className = "block-head";
    head.innerHTML = `<span class="handle">⠿</span><span class="order-no">${idx + 1}</span>`;

    const sel = document.createElement("select");
    ROLES.forEach(([v, lbl]) => {
      const o = document.createElement("option");
      o.value = v; o.textContent = lbl; o.selected = b.role === v;
      sel.appendChild(o);
    });
    sel.onchange = () => { b.role = sel.value; saveDraft(); render(); };
    head.appendChild(sel);

    const conf = document.createElement("span");
    conf.className = "conf" + (b.minConf < 0.9 ? " low" : "");
    conf.textContent = "conf " + b.minConf.toFixed(2);
    conf.title = "confidence thấp nhất trong các dòng OCR của block này";
    head.appendChild(conf);

    const spacer = document.createElement("span");
    spacer.className = "spacer";
    head.appendChild(spacer);

    const btnUp = mkBtn("↑", () => move(idx, -1));
    const btnDown = mkBtn("↓", () => move(idx, +1));
    const btnMerge = mkBtn("⇧ nối", () => merge(idx));
    btnMerge.title = "Gộp block này vào block phía trên (nối đoạn)";
    if (idx === 0) btnMerge.disabled = true;
    head.append(btnUp, btnDown, btnMerge);
    card.appendChild(head);

    const ta = document.createElement("textarea");
    ta.value = b.text;
    ta.rows = Math.min(8, Math.max(2, Math.ceil(b.text.length / 70)));
    ta.oninput = () => { b.text = ta.value; saveDraft(); };
    card.appendChild(ta);

    if (b.role === "section_title") {
      const row = document.createElement("div");
      row.className = "icon-row";
      row.innerHTML = `<span>icon_hint:</span>`;
      const inp = document.createElement("input");
      inp.placeholder = "vd: broccoli";
      inp.value = b.icon;
      inp.oninput = () => { b.icon = inp.value; saveDraft(); };
      row.appendChild(inp);
      card.appendChild(row);
    }

    if (b.lines.length > 1 || (b.lines.length === 1 && b.lines[0].confidence < 0.9)) {
      const det = document.createElement("details");
      det.className = "lines";
      const rows = b.lines.map(l =>
        `<tr class="${l.confidence < 0.9 ? "low" : ""}"><td>${l.confidence.toFixed(2)}</td><td>${escapeHtml(l.text)}</td></tr>`).join("");
      det.innerHTML = `<summary>${b.lines.length} dòng OCR gốc</summary><table>${rows}</table>`;
      card.appendChild(det);
    }

    card.onclick = (e) => { if (e.target === card || e.target.className === "block-head") select(b.id, "left"); };
    card.ondragstart = (e) => { e.dataTransfer.setData("text/plain", b.id); select(b.id, null); };
    card.ondragover = (e) => { e.preventDefault(); card.classList.add("dragover"); };
    card.ondragleave = () => card.classList.remove("dragover");
    card.ondrop = (e) => {
      e.preventDefault(); card.classList.remove("dragover");
      const fromId = e.dataTransfer.getData("text/plain");
      const from = blocks.findIndex(x => x.id === fromId);
      let to = blocks.findIndex(x => x.id === b.id);
      if (from < 0 || from === to) return;
      const [m] = blocks.splice(from, 1);
      blocks.splice(to, 0, m);
      saveDraft(); render();
    };
    right.appendChild(card);
  });
}

function mkBtn(label, fn) {
  const btn = document.createElement("button");
  btn.className = "small"; btn.textContent = label;
  btn.onclick = (e) => { e.stopPropagation(); fn(); };
  return btn;
}
function move(idx, delta) {
  const to = idx + delta;
  if (to < 0 || to >= blocks.length) return;
  const [m] = blocks.splice(idx, 1);
  blocks.splice(to, 0, m);
  saveDraft(); render();
}
function merge(idx) {
  if (idx === 0) return;
  const prev = blocks[idx - 1], cur = blocks[idx];
  prev.text = (prev.text.trimEnd() + " " + cur.text.trimStart()).trim();
  prev.lines = prev.lines.concat(cur.lines);
  prev.minConf = Math.min(prev.minConf, cur.minConf);
  blocks.splice(idx, 1);
  selectedId = prev.id;
  saveDraft(); render();
}
function select(id, scrollSide) {
  selectedId = id;
  render();
  if (scrollSide) {
    const el = document.querySelector(
      (scrollSide === "left" ? ".bbox" : ".block") + `[data-id="${CSS.escape(id)}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function render() { renderLeft(); renderRight(); }

// ---------------- export ----------------
document.getElementById("export").onclick = () => {
  const active = blocks.filter(b => b.role !== "ignore" && b.text.trim());
  const titleBlocks = active.filter(b => b.role === "article_title");
  const articleTitle = titleBlocks.map(b => b.text.trim()).join(" ").trim();
  const problems = [];
  if (!articleTitle) problems.push("Chưa có block nào là 'Tiêu đề bài'.");

  const sections = [];
  let cur = null;
  for (const b of active) {
    if (b.role === "article_title") continue;
    if (b.role === "section_title") {
      if (cur) sections.push(cur);
      cur = { title: b.text.trim(), body: "", icon_hint: (b.icon || "").trim() };
    } else { // body
      if (!cur) cur = { title: articleTitle || "Intro", body: "", icon_hint: "" };
      cur.body = cur.body ? cur.body + "\n\n" + b.text.trim() : b.text.trim();
    }
  }
  if (cur) sections.push(cur);
  sections.forEach((s, i) => { s.order = i; });
  sections.filter(s => !s.body.trim()).forEach(s => problems.push(`Section "${s.title}" không có thân bài.`));
  if (!sections.length) problems.push("Không có section nào.");
  if (problems.length && !confirm("Có vấn đề:\n- " + problems.join("\n- ") + "\n\nVẫn xuất?")) return;

  const out = {
    schema_version: OCR.schema_version,
    slug: OCR.slug,
    title: articleTitle || "Untitled",
    sections: sections.map(s => ({ order: s.order, title: s.title, body: s.body, icon_hint: s.icon_hint })),
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "normalized_sections.json";
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById("reset").onclick = () => {
  if (!confirm("Bỏ toàn bộ chỉnh sửa, quay về kết quả OCR gốc?")) return;
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  blocks = freshState(); selectedId = null;
  document.getElementById("draft-note").textContent = "";
  render();
};

document.getElementById("title").textContent = "Duyệt OCR · " + OCR.slug + " · " + OCR.engine;
blocks = loadDraft() || freshState();
if (localStorage.getItem(LS_KEY)) document.getElementById("draft-note").textContent = "đang dùng nháp đã lưu";
render();
</script>
</body>
</html>
